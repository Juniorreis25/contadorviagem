<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contagem Regressiva – Viagem</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a;
      --txt: #fff;
      --accent: #00e5ff;
      --glow: rgba(0, 229, 255, 0.55);
      --alert: #ff3333;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--txt);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Flash overlay */
    .wrapper { width: 92%; max-width: 880px; text-align: center; }
    /* Countdown */
    h1 { font-size: clamp(1.4rem, 4vw, 2.2rem); }
    #countwrap { margin-top: 1rem; }
    #timer {
      font-family: 'Montserrat', monospace;
      font-size: clamp(1.25rem, 7vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-shadow: 0 0 12px var(--glow), 0 0 24px var(--glow);
    }

  </style>
</head>
<body>
  <main class="wrapper">
    <h1>Contagem regressiva para a viagem</h1>
    <p>17 de fevereiro de 2027</p>
    <div id="countwrap"><div id="timer" role="timer">00d 00:00:00</div></div>
  </main>

  <script>
    /* Início de 17/02/2027 no horário de Brasília */
    const target = new Date('2027-02-17T00:00:00-03:00').getTime();

    const timer = document.getElementById('timer');

    /* Countdown */
    function tick() {
      const diff = target - Date.now();
      if (diff <= 0) {
        timer.textContent = 'CHEGOU!';
        return;
      }
      const days = Math.floor(diff / 864e5);
      const h = Math.floor(diff / 36e5) % 24;
      const m = Math.floor(diff / 6e4) % 60;
      const s = Math.floor(diff / 1e3) % 60;
      timer.textContent = `${days.toString().padStart(2, '0')}d ${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
