<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contagem Regressiva – Viagem</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: #237d82;
      color: #163b36;
      font-family: 'DM Sans', system-ui, sans-serif;
    }
    .beach {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 76% center;
      pointer-events: none;
    }
    .wrapper {
      position: relative;
      width: min(100%, 37rem);
      padding: clamp(1.25rem, 6vw, 3.5rem) 1rem;
      text-align: center;
      background: #fffcf3;
      border-radius: 1.25rem;
      box-shadow: 0 14px 48px #123c3b29;
    }
    h1 { margin: 0; font-size: clamp(1.25rem, 4vw, 2rem); font-weight: 500; letter-spacing: -.035em; }
    p { margin: .6rem 0 0; color: #44635e; }
    #countwrap { margin-top: clamp(1.2rem, 4vw, 2rem); }
    #timer {
      font-size: clamp(1.65rem, 7.8vw, 4rem);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.05em;
      line-height: 1.1;
    }
  </style>
</head>
<body>
  <img class="beach" src="assets/serrambi.webp" alt="" fetchpriority="high" />
  <main class="wrapper">
    <h1>Contagem regressiva para a viagem</h1>
    <p>17 de fevereiro de 2027</p>
    <div id="countwrap"><div id="timer" role="timer">00d 00:00:00</div></div>
  </main>

  <script>
    /* Início de 17/02/2027 no horário de Brasília */
    const target = new Date('2027-02-17T00:00:00-03:00').getTime();

    const timer = document.getElementById('timer');

    /* Countdown */
    function tick() {
      const diff = target - Date.now();
      if (diff <= 0) {
        timer.textContent = 'CHEGOU!';
        return;
      }
      const days = Math.floor(diff / 864e5);
      const h = Math.floor(diff / 36e5) % 24;
      const m = Math.floor(diff / 6e4) % 60;
      const s = Math.floor(diff / 1e3) % 60;
      timer.textContent = `${days.toString().padStart(2, '0')}d ${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
